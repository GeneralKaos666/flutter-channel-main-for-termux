[flutter]
tag = 'main'
# Framework version from `flutter --version --machine` at the pinned
# revision (next pre-release past the last stable per flutter_tools
# version.dart, e.g. past 3.47.5 -> 3.47.6-0.0.pre). Translated to Debian
# tilde form for the deb version so main snapshots sort above last stable.
framework_version = '3.49.0-0.1.pre'
repo = 'https://github.com/flutter/flutter'
path = './flutter'
dart_version = '3.14.0 (build 3.14.0-271.0.dev)'
framework_revision = 'd649d2bfebfeb0018b7333bd7bee1d5127661da2'
framework_commit_date = '2026-09-30 16:42:53 +0000'
devtools_version = '2.61.0-dev.0'

[ndk]
api = 26 # >=26
version = '29.0.14206865' # r29; r30 (30.0.16248370) blocked upstream on lzhiyong/termux-ndk
# unset to use ANDROID_NDK from env
# path = 'path/to/ndk'

[build]
arch = ['arm64']       # arm, arm64, x86, x64
runtime = ['release']  # debug, release, profile; the deb packages only these modes' artifacts
gclient = './.gclient'

[android]
compile_sdk = 36   # Stage-B ladder: 36 > 35 > 34; TERMUX_COMPILE_SDK overrides at runtime on-device
target_sdk  = 36

[installer]
java     = 'openjdk-21'  # single JDK; openjdk-25 available as future bump
zip_tool = '7zip'        # 26.03 (was p7zip)

[patch.engine]
file = './patches/engine.patch'
path = '.'

[patch.dart]
file = './patches/dart.patch'
path = 'engine/src/flutter/third_party/dart'

[patch.skia]
file = './patches/skia.patch'
path = 'engine/src/flutter/third_party/skia'

[sysroot]
path = './sysroot'

[sysroot.termux-main]
repo = 'https://packages-cf.termux.dev/apt/termux-main/'
dist = 'stable'
pkgs = [
  'at-spi2-core',
  'brotli',
  'dbus',
  'fontconfig',
  'freetype',
  'fribidi',
  'gdk-pixbuf',
  'glib',
  'harfbuzz',
  'libcairo',
  'libepoxy',
  'libexpat',
  'libffi',
  'libglvnd',
  'libgraphite',
  'libjpeg-turbo',
  'liblzma',
  'libpixman',
  'libpng',
  'libtiff',
  'libwayland',
  'libx11',
  'libxau',
  'libxcb',
  'libxcursor',
  'libxdmcp',
  'libxext',
  'libxfixes',
  'libxft',
  'libxi',
  'libxrandr',
  'libxrender',
  'libxtst',
  'pango',
  'pcre2',
  'swiftshader',
  'xorgproto',
  'zlib',
  'zstd',
]

[sysroot.termux-x11]
repo = 'https://packages-cf.termux.dev/apt/termux-x11/'
dist = 'x11'
pkgs = ['gtk3', 'libxcomposite', 'libxdamage', 'libxinerama', 'libxkbcommon']

[package]
conf = './package.yaml'
path = '.'
pkg_rel = '1'  # Debian packaging revision suffix (e.g. 1 -> 3.47.5-1)
