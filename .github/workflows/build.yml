name: build

on:
  workflow_dispatch:
    inputs:
      no-sccache:
        description: 'Disable sccache (cache-poison escape hatch)'
        required: false
        default: 'false'
  schedule:
    # Daily autobuild (if anything new). Refresh runs 09:00 UTC; build at
    # 12:00 UTC so it sees freshly pushed pins. The gate job skips the
    # multi-hour build when pins are stale (refresh conflict/failed) or the
    # deb for the current pins is already released — so no new tag is ever
    # pushed until conflicts are resolved and the build succeeds.
    - cron: '0 12 * * *'

concurrency:
  group: build-hosted
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    # Cheap change detector: decides whether the expensive engine build
    # should run. Manual dispatches always build. Scheduled runs build only
    # when build.toml pins equal upstream HEAD (no refresh conflict pending)
    # AND the deb derived from those pins is absent from the release.
    # The deb name is recomputed here from build.toml at tip, so it always
    # matches whatever `python build.py` would package at build time.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      reason: ${{ steps.decide.outputs.reason }}
      release_tag: ${{ steps.decide.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Decide whether a build is needed
        id: decide
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual-dispatch" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: always build."
            exit 0
          fi
          HEAD=$(git ls-remote https://github.com/flutter/flutter.git HEAD | cut -f1)
          if [ -z "$HEAD" ]; then
            echo "empty ls-remote result for upstream HEAD" >&2
            exit 1
          fi
          python3 - "$HEAD" >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import os
          import sys
          import tomllib
          import urllib.error
          import urllib.request

          head = sys.argv[1]
          with open("build.toml", "rb") as f:
              cfg = tomllib.load(f)
          flutter = cfg.get("flutter", {})
          tag = str(flutter.get("tag") or "main")
          fw_ver = str(flutter.get("framework_version", "") or "").strip()
          pinned = str(flutter.get("framework_revision") or "")
          commit_date = str(flutter.get("framework_commit_date") or "")
          pkg_rel = str(cfg.get("package", {}).get("pkg_rel") or "").strip()

          # Single-sourced from scripts/ci/version_lib so the gate deb name
          # matches Build.output() at build time, including the stable
          # per-deb GitHub release tag (v<upstream>.<YYYYMMDD>.<shorthash>).
          sys.path.insert(0, "scripts/ci")
          import version_lib

          day = commit_date.split(" ")[0].replace("-", "") if commit_date else ""
          snapshot = version_lib.snapshot_stamp(commit_date, pinned) if day and pinned else ""
          release_tag = version_lib.release_tag(fw_ver, commit_date, pinned) or tag
          package_version = version_lib.deb_version(tag, pkg_rel, snapshot, fw_ver)
          deb_name = version_lib.asset_name(tag, pkg_rel, snapshot, fw_ver)
          print(f"release_tag={release_tag}")

          def emit(build, reason):
              print(f"should_build={'true' if build else 'false'}")
              print(f"reason={reason}")
              print(f"upstream HEAD: {head[:12]}, pinned: {pinned[:12] if pinned else '(empty)'}, tag: {release_tag}, deb: {deb_name} -> {reason}")

          if not pinned:
              emit(False, "no-pinned-revision")
              raise SystemExit(0)
          if head != pinned:
              # Refresh has not landed (conflict, failure, or not yet run):
              # do NOT build stale pins and do NOT push any tag.
              emit(False, "pins-stale")
              raise SystemExit(0)

          repo = os.environ.get("GITHUB_REPOSITORY", "")
          token = os.environ.get("GITHUB_TOKEN", "")
          url = f"https://api.github.com/repos/{repo}/releases/tags/{release_tag}"
          headers = {
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          if token:
              headers["Authorization"] = "Bearer " + token
          req = urllib.request.Request(url, headers=headers)
          try:
              with urllib.request.urlopen(req) as resp:
                  release = json.loads(resp.read().decode("utf-8"))
          except urllib.error.HTTPError as e:
              if e.code == 404:
                  emit(True, "no-release-yet")
                  raise SystemExit(0)
              raise
          assets = {a.get("name", "") for a in release.get("assets", [])}
          if deb_name in assets:
              emit(False, "already-released")
          else:
              emit(True, "new-pins-unreleased")

          PY

  Ubuntu:
    needs: gate
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || needs.gate.outputs.should_build == 'true'
    timeout-minutes: 360

    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1

      - name: install deps
        run: |
          sudo apt update
          sudo apt install -y \
            libfreetype-dev \
            libfontconfig1-dev \
            ninja-build

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: install python requirements
        run: python -m pip install -r requirements.txt

      - name: Set up sccache
        if: github.event.inputs.no-sccache != 'true'
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: 'v0.10.0'

      - name: Ensure depot_tools is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gclient >/dev/null 2>&1; then
            DEPOT_DIR="$RUNNER_TEMP/depot_tools"
            if [ ! -d "$DEPOT_DIR" ]; then
              git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$DEPOT_DIR"
            fi
            echo "$DEPOT_DIR" >> "$GITHUB_PATH"
          fi

      - name: detect Android NDK
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_NDK:-}" ]; then
            NDK_DIR="$ANDROID_NDK"
          elif [ -n "${ANDROID_NDK_LATEST_HOME:-}" ]; then
            NDK_DIR="$ANDROID_NDK_LATEST_HOME"
          elif [ -n "${ANDROID_NDK_HOME:-}" ]; then
            NDK_DIR="$ANDROID_NDK_HOME"
          else
            echo "Android NDK not found on runner" >&2
            exit 1
          fi
          if [ ! -f "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; then
            echo "Error: NDK at '$NDK_DIR' missing expected toolchain: clang" >&2
            exit 1
          fi
          echo "ANDROID_NDK=$NDK_DIR" >> "$GITHUB_ENV"

      - name: build flutter/toolchain + package deb
        env:
          SCCACHE_GHA_ENABLED: 'true'
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.no-sccache }}" != "true" ]; then
            sccache --show-stats || true
          fi
          echo "BUILD_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          python build.py
          if [ "${{ github.event.inputs.no-sccache }}" != "true" ]; then
            sccache --show-stats || true
          fi

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: engine-build-logs
          path: |
            flutter/engine/src/out/**/*.log
            **/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: parse tag
        id: parser
        run: |
          TAG=$(NO_RECORD=1 python -c "import build; print(build.Build().release_tag)")
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "TITLE=Flutter $TAG" >> "$GITHUB_OUTPUT"

      - name: Collect artifact metadata
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          DEB=$(python -c "import build; print(build.Build().output('arm64'))")
          PACKAGE_VERSION=$(python -c "import build; print(build.Build().package_version)")
          test -f "$DEB"
          sha256sum "$DEB" | tee "${DEB}.sha256"
          stat -c '%s' "$DEB" | tee "${DEB}.size.txt"
          TZ=UTC dpkg-deb -c "$DEB" > inventory.txt
          TREE_SHA=$(git log -1 --format='%T' HEAD)
          NOW_EPOCH=$(date +%s)
          START_EPOCH="${BUILD_START_EPOCH:-$NOW_EPOCH}"
          BUILD_DURATION=$((NOW_EPOCH - START_EPOCH))
          DEB_SHA=$(awk '{print $1}' "${DEB}.sha256")
          DEB_SIZE=$(cat "${DEB}.size.txt")
          INVENTORY_COUNT=$(wc -l < inventory.txt)
          export TAG="${{ steps.parser.outputs.TAG }}"
          export PACKAGE_VERSION
          export RUN_ID="${{ github.run_id }}"
          export BUILD_NUMBER="${{ github.run_number }}"
          export SOURCE_COMMIT="${{ github.sha }}"
          export TREE_SHA DEB_SHA DEB_SIZE BUILD_DURATION INVENTORY_COUNT
          python - <<'PY'
          import json
          import os

          package_version = os.environ["PACKAGE_VERSION"]
          run_id = os.environ["RUN_ID"]
          build_number = os.environ["BUILD_NUMBER"]
          source_commit = os.environ["SOURCE_COMMIT"]
          tree_sha = os.environ["TREE_SHA"]
          deb_sha = os.environ["DEB_SHA"]
          deb_size = int(os.environ["DEB_SIZE"])
          build_duration = int(os.environ["BUILD_DURATION"])
          inventory_count = int(os.environ["INVENTORY_COUNT"])

          metadata = {
              "version": package_version,
              "arch": "arm64",
              "run_id": run_id,
              "build_number": build_number,
              "source_commit": source_commit,
              "tree_sha": tree_sha,
              "sha256": deb_sha,
              "size_bytes": deb_size,
              "build_duration_seconds": build_duration,
          }
          evidence = {
              "type": "build_evidence",
              "version": package_version,
              "arch": "arm64",
              "run_id": run_id,
              "build_number": build_number,
              "source_commit": source_commit,
              "tree_sha": tree_sha,
              "deb_sha256": deb_sha,
              "deb_size_bytes": deb_size,
              "inventory_file_count": inventory_count,
              "build_duration_seconds": build_duration,
          }

          with open("build_metadata.json", "w", encoding="utf-8") as f:
              json.dump(metadata, f, indent=2)
          with open("build_evidence.json", "w", encoding="utf-8") as f:
              json.dump(evidence, f, indent=2)
          PY
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"

      - name: last commit message
        id: commitmsg
        run: |
          MSG=$(git log -1 --format=%B)
          echo "BODY<<EOF" >> "$GITHUB_OUTPUT"
          echo "$MSG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Verify release asset before publish
        env:
          LIGHTWEIGHT_CHECK: '1'
        run: |
          set -euo pipefail
          python scripts/ci/verify_release_asset.py

      - name: Check release asset immutability
        id: release_guard
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export TAG="${{ steps.parser.outputs.TAG }}"
          export REPOSITORY="${{ github.repository }}"
          export DEB_NAME="$(basename '${{ steps.artifact.outputs.deb }}')"
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["REPOSITORY"]
          tag = os.environ["TAG"]
          deb_name = os.environ["DEB_NAME"]
          token = os.environ.get("GITHUB_TOKEN", "")
          out_file = os.environ["GITHUB_OUTPUT"]
          url = f"https://api.github.com/repos/{repo}/releases/tags/{tag}"
          headers = {
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          if token:
              headers["Authorization"] = "Bearer " + token

          req = urllib.request.Request(url, headers=headers)
          try:
              with urllib.request.urlopen(req) as resp:
                  release = json.loads(resp.read().decode("utf-8"))
          except urllib.error.HTTPError as e:
              if e.code == 404:
                  with open(out_file, "a", encoding="utf-8") as f:
                      f.write("should_publish=true\n")
                  print("No existing release found for tag; publish is allowed.")
                  raise SystemExit(0)
              raise

          assets = {asset.get("name", "") for asset in release.get("assets", [])}
          should_publish = deb_name not in assets
          with open(out_file, "a", encoding="utf-8") as f:
              f.write(f"should_publish={'true' if should_publish else 'false'}\n")
          if should_publish:
              print(f"Release exists but primary asset '{deb_name}' is absent; publish is allowed.")
          else:
              print(f"Primary asset '{deb_name}' already exists on release tag {tag}; skipping publish to preserve immutability.")
          PY

      - name: release
        if: steps.release_guard.outputs.should_publish == 'true' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.parser.outputs.TAG }}
          name: ${{ steps.parser.outputs.TITLE }}
          body: ${{ steps.commitmsg.outputs.BODY }}
          draft: false
          # Keep-stable per 2026-09-29 decision: safe because release_tag is
          # always date+hash suffixed (v<upstream>.<YYYYMMDD>.<shorthash>),
          # never a bare semver, so per-deb tags cannot collide with stable
          # tags; the release_guard gate above + overwrite_files:false below
          # preserve asset immutability.
          prerelease: false # Keep-stable per 2026-09-29 decision: safe because release_tag is date+hash suffixed, never bare semver.
          make_latest: true
          files: |
            ${{ steps.artifact.outputs.deb }}
            ${{ steps.artifact.outputs.deb }}.sha256
            ${{ steps.artifact.outputs.deb }}.size.txt
            inventory.txt
            build_metadata.json
            build_evidence.json
          overwrite_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}