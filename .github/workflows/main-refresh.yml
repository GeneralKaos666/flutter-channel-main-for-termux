name: main-refresh

# Tracks Flutter main: probes upstream HEAD nightly, refreshes the
# build.toml pins + snapshot stamp when main moves, and pushes so the next
# scheduled build.yml run (12:00 UTC, gated) packages the latest engine.
# Refresh only — it never builds and never pushes tags (see build.yml).
# Patch conflicts fail closed here (no pin push) and again in build.yml
# (no tag/release). There is intentionally no stable-version logic here
# (the old autorelease.yml was deleted because its stable bump corrupted
# main-tracking files).

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Probe upstream main HEAD
        id: probe
        run: |
          set -euo pipefail
          HEAD=$(git ls-remote https://github.com/flutter/flutter.git HEAD | cut -f1)
          if [ -z "$HEAD" ]; then
            echo "empty ls-remote result for upstream HEAD" >&2
            exit 1
          fi
          echo "HEAD=$HEAD" >> "$GITHUB_OUTPUT"
          echo "upstream main HEAD: $HEAD"

      - name: Compare with pinned revision
        id: check
        run: |
          python3 - "${{ steps.probe.outputs.HEAD }}" >> "$GITHUB_OUTPUT" <<'PY'
          import sys
          import tomllib
          head = sys.argv[1]
          with open("build.toml", "rb") as f:
              current = tomllib.load(f)["flutter"].get("framework_revision", "")
          if head == current:
              print("should_refresh=false")
              print(f"already at upstream main ({head[:7]}), nothing to do.", file=sys.stderr)
          else:
              print("should_refresh=true")
              print(f"main moved: {current[:7]} -> {head[:7]}", file=sys.stderr)
          PY

      - name: Probe release metadata from a shallow main checkout
        id: meta
        if: steps.check.outputs.should_refresh == 'true'
        run: |
          set -euo pipefail
          rm -rf /tmp/flutter-probe
          git clone --depth 1 https://github.com/flutter/flutter.git /tmp/flutter-probe
          cd /tmp/flutter-probe
          CLONE_HEAD=$(git rev-parse HEAD)
          if [ "$CLONE_HEAD" != "${{ steps.probe.outputs.HEAD }}" ]; then
            echo "clone raced upstream ($CLONE_HEAD != ${{ steps.probe.outputs.HEAD }}); rerun later." >&2
            exit 1
          fi
          git config --global --add safe.directory /tmp/flutter-probe
          /tmp/flutter-probe/bin/flutter --version --machine > /tmp/flutter-version.json
          python3 - /tmp/flutter-version.json >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import re
          import sys
          with open(sys.argv[1], encoding="utf-8") as f:
              m = json.load(f)
          rev = m.get("frameworkRevision", "")
          date = m.get("frameworkCommitDate", "")
          dart = m.get("dartSdkVersion", "")
          devtools = m.get("devToolsVersion", "")
          fwver = m.get("frameworkVersion", "")
          for name, value in (("frameworkRevision", rev), ("frameworkCommitDate", date),
                              ("dartSdkVersion", dart), ("devToolsVersion", devtools),
                              ("frameworkVersion", fwver)):
              if not value:
                  raise SystemExit(f"flutter --version --machine missing {name}; full JSON:\n{json.dumps(m, indent=2)[:2000]}")
          if not re.fullmatch(r"[0-9a-f]{40}", rev):
              raise SystemExit(f"unexpected frameworkRevision: {rev!r}")
          if not re.fullmatch(r"\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2} [+-]\d{4}", date):
              raise SystemExit(f"unexpected frameworkCommitDate format: {date!r}")
          if fwver == "0.0.0-unknown":
              raise SystemExit(f"flutter --version --machine returned unknown frameworkVersion; full JSON:\n{json.dumps(m, indent=2)[:2000]}")
          if not re.fullmatch(r"\d+\.\d+\.\d+(-\d+\.\d+\.pre(-\d+)?)?", fwver):
              raise SystemExit(f"unexpected frameworkVersion format: {fwver!r}")
          print(f"NEW_REV={rev}")
          print(f"NEW_DATE={date}")
          print(f"NEW_DART={dart}")
          print(f"NEW_DEVTOOLS={devtools}")
          print(f"NEW_FWVER={fwver}")
          PY

      - name: Validate patches against probed HEAD (fail closed)
        if: steps.check.outputs.should_refresh == 'true'
        run: |
          set -euo pipefail
          # On patch conflict stop here: no pin bump, no push, and therefore
          # no downstream build/tag. Engine patch must apply cleanly to the
          # probed framework checkout; dart/skia trees are absent here
          # (fetched via .gclient custom_hooks), so parse-level check only
          # (same contract as validate.yml).
          cd /tmp/flutter-probe
          git apply --check "${GITHUB_WORKSPACE}/patches/engine.patch"
          git apply --stat "${GITHUB_WORKSPACE}/patches/dart.patch" > /tmp/dart.stat
          git apply --stat "${GITHUB_WORKSPACE}/patches/skia.patch" > /tmp/skia.stat
          grep -Eq ' (pkg|runtime|sdk)/' /tmp/dart.stat
          grep -Eq ' include/' /tmp/skia.stat
          echo "patches validate OK against ${{ steps.probe.outputs.HEAD }}"

      - name: Bump build.toml pins
        if: steps.check.outputs.should_refresh == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          import os
          p = Path("build.toml")
          text = p.read_text(encoding="utf-8")
          for field, value in (
              ("dart_version", "${{ steps.meta.outputs.NEW_DART }}"),
              ("framework_version", "${{ steps.meta.outputs.NEW_FWVER }}"),
              ("framework_revision", "${{ steps.meta.outputs.NEW_REV }}"),
              ("framework_commit_date", "${{ steps.meta.outputs.NEW_DATE }}"),
              ("devtools_version", "${{ steps.meta.outputs.NEW_DEVTOOLS }}"),
          ):
              text, n = re.subn(rf"(?m)^{field} = '[^']*'", f"{field} = '{value}'", text)
              if n != 1:
                  raise SystemExit(f"expected 1 {field} line in build.toml, rewrote {n}")
          p.write_text(text, encoding="utf-8")
          PY
          git diff -- build.toml

      - name: Sync version references and verify
        if: steps.check.outputs.should_refresh == 'true'
        run: |
          set -euo pipefail
          pip install -q -r requirements.txt
          python3 scripts/ci/generate_versions.py
          python3 scripts/ci/check_version_drift.py --fix
          python3 scripts/ci/check_repo.py
          git diff --stat
          git diff --check

      - name: Commit and push refresh
        if: steps.check.outputs.should_refresh == 'true'
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "pins already current after sync; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(main): refresh pins to flutter/main@${{ steps.probe.outputs.HEAD }}"
          # Branch push only (never --tags, never --force): on a push race
          # (non-fast-forward) this fails with no pin push, and the gated
          # build.yml run then skips (pins-stale) so no new tag is pushed
          # until the conflict is resolved.
          git push
